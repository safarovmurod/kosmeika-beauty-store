services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: beauty
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: beauty
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - beauty-db:/var/lib/postgresql/data
volumes:
  beauty-db:
